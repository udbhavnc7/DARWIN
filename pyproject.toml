[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-engine"
version = "0.1.0"
description = "Correctness-gated backend architecture experiments"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "redis>=5,<9", "PyYAML>=6,<7", "filelock>=3,<4", "psutil>=6,<8", "websockets>=14,<17", "locust>=2.34,<3", "simpy>=4.1,<5", "pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a disposable PostgreSQL database and Redis"]

