name: CI

on:
  push:
    branches: [master, exhibition-readiness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: darwin
          POSTGRES_PASSWORD: darwin_demo
          POSTGRES_DB: darwin_shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U darwin -d darwin_shop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DARWIN_TEST_DATABASE_URL: postgresql://darwin:darwin_demo@127.0.0.1:5432/darwin_shop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install PostgreSQL client tools and Redis
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-server
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e .
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Type-check and build
        run: npm --prefix frontend run build

  docker-acceptance:
    name: Docker acceptance (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e .
      - name: Run Docker acceptance
        run: python scripts/validate_docker.py --output artifacts/docker-acceptance
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-acceptance
          path: artifacts/docker-acceptance
          if-no-files-found: warn
